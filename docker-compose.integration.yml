services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.38.5@sha256:f98bb7c2e0818412e414d456ab31ef48be2dc5ce5d1e6fae7ae171fbb6923093
    environment:
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_HOST: n8n
      WEBHOOK_URL: http://n8n:5678/
      GENERIC_TIMEZONE: UTC
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5678/healthz/readiness"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 20s

  bootstrap:
    build:
      context: .
      dockerfile: tests/docker/Integration.Dockerfile
    entrypoint: ["node", "/opt/skill-test/bootstrap.mjs"]
    volumes:
      - test-secrets:/secrets
    depends_on:
      n8n:
        condition: service_healthy

  n8n-mcp:
    build:
      context: ./tests/docker/mcp
    environment:
      MCP_MODE: http
      PORT: "3000"
      N8N_API_URL: http://n8n:5678
      N8N_MCP_TELEMETRY_DISABLED: "true"
      LOG_LEVEL: error
      # This isolated test stack must reach the private Docker address of n8n.
      WEBHOOK_SECURITY_MODE: permissive
    volumes:
      - test-secrets:/secrets:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 15s

  integration:
    build:
      context: .
      dockerfile: tests/docker/Integration.Dockerfile
    init: true
    entrypoint: ["node", "/opt/skill-test/integration.mjs"]
    environment:
      SKILL_TEST_MODEL: ${SKILL_TEST_MODEL:-local/configured}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      KILO_API_KEY: ${KILO_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL_ID: ${LLM_MODEL_ID:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      SKILL_TEST_TIMEOUT_SECONDS: ${SKILL_TEST_TIMEOUT_SECONDS:-360}
    volumes:
      - test-secrets:/secrets:ro
    depends_on:
      n8n-mcp:
        condition: service_healthy

volumes:
  n8n-data:
  test-secrets:
